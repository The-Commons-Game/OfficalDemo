<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Commons</title>
<meta name="description" content="The Commons — a Westminster political career simulator.">
<style>
:root{
  --bg:#f3f0e9;--surface:#fffdf8;--surface2:#eee9df;--text:#202733;--muted:#68707b;
  --line:#d5cfc3;--navy:#19375d;--red:#8e2638;--green:#286849;--amber:#9a6818;
  --shadow:0 12px 35px rgba(28,35,45,.10);--radius:14px
}
body.dark{--bg:#10151b;--surface:#181e26;--surface2:#202731;--text:#edf1f5;--muted:#a9b1bb;--line:#303844;--navy:#8fb2df;--red:#e18a9a;--green:#79c69c;--amber:#e2b86b;--shadow:0 12px 35px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Georgia,"Times New Roman",serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:rgba(255,253,248,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
body.dark header{background:rgba(24,30,38,.93)}
.nav{max-width:1250px;margin:auto;padding:11px 18px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:18px;letter-spacing:.02em}
.logo{width:38px;height:38px}
.navlinks{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.navlinks button,.secondary{border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 11px;border-radius:8px}
main{max-width:1250px;margin:auto;padding:28px 18px 70px}
.hero{display:grid;grid-template-columns:1.45fr .85fr;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.hero-main{padding:38px}
.hero-side{padding:30px;background:var(--surface2);border-left:1px solid var(--line)}
.eyebrow{text-transform:uppercase;letter-spacing:.15em;font:700 11px Arial,sans-serif;color:var(--muted)}
h1{font-size:clamp(44px,7vw,78px);line-height:.91;margin:10px 0 20px}
h2{margin:0 0 12px;font-size:27px}h3{margin:0 0 8px}
p{line-height:1.55}.muted{color:var(--muted)}
.primary{border:0;background:var(--navy);color:white;padding:11px 15px;border-radius:8px;font-weight:bold}
.danger{border:0;background:var(--red);color:white;padding:11px 15px;border-radius:8px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.career{min-height:190px;display:flex;flex-direction:column}
.career .primary{margin-top:auto}
.section{margin-top:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--surface)}
.stat b{display:block;font-size:24px;margin-top:3px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font:12px Arial,sans-serif;color:var(--muted)}
.notice{padding:13px;border-left:4px solid var(--navy);background:color-mix(in srgb,var(--navy) 8%,var(--surface));border-radius:7px}
.choice{width:100%;text-align:left;padding:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px}
.choice:hover{border-color:var(--navy);transform:translateY(-1px)}
.choice strong{display:block;margin-bottom:4px}.list{display:grid;gap:9px}
.log{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:320px}
.log>div{padding:10px;border-bottom:1px solid var(--line)}.log>div:last-child{border:0}
.field{display:grid;gap:6px;margin:11px 0}.field input,.field select,.field textarea{
  width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)
}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}
.modal.open{display:flex}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:23px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--bg);padding:12px 15px;border-radius:9px;display:none;z-index:40}
footer{max-width:1250px;margin:auto;border-top:1px solid var(--line);padding:25px 18px;color:var(--muted)}
.hidden{display:none!important}
@media(max-width:850px){.hero,.split{grid-template-columns:1fr}.hero-side{border-left:0;border-top:1px solid var(--line)}.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.nav{align-items:flex-start}.navlinks{margin-left:0}h1{font-size:48px}}
</style>
</head>
<body>
<header><nav class="nav">
  <div class="brand">
    <svg class="logo" viewBox="0 0 100 100" aria-label="The Commons logo">
      <path d="M50 7 85 20v29c0 24-14 38-35 44C29 87 15 73 15 49V20z" fill="none" stroke="currentColor" stroke-width="6"/>
      <path d="M29 39h42M34 52h32M40 65h20" fill="none" stroke="currentColor" stroke-width="5"/>
      <circle cx="50" cy="25" r="6" fill="currentColor"/>
    </svg>
    <span>The Commons</span>
  </div>
  <div class="navlinks">
    <button onclick="home()">Home</button>
    <button onclick="careers()">Careers</button>
    <button onclick="daily()">Daily Report</button>
    <button onclick="sharePage()">Share</button>
    <button onclick="settings()">Settings</button>
  </div>
</nav></header>

<main id="app"></main>
<footer>The Commons · Political career simulation · Save data is stored in this browser.</footer>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

const PM_LIST=[
"Winston Churchill","Anthony Eden","Harold Macmillan","Alec Douglas-Home","Harold Wilson",
"Edward Heath","James Callaghan","Margaret Thatcher","John Major","Tony Blair","Gordon Brown",
"David Cameron","Theresa May","Boris Johnson","Liz Truss","Rishi Sunak","Sir Keir Starmer"
];
const PARTIES=["Labour","Conservative","Liberal Democrats","Green","Reform","Independent"];
const ROLES={
 pm:"Prime Minister",mp:"Member of Parliament",chancellor:"Chancellor",
 electioneer:"Electioneer",voter:"Voter",reporter:"News Reporter",lord:"House of Lords"
};
const HIST_CAB={
"Winston Churchill":["Anthony Eden","R. A. Butler","Harold Macmillan","Lord Cherwell"],
"Harold Wilson":["James Callaghan","Roy Jenkins","Barbara Castle","Denis Healey"],
"Margaret Thatcher":["Geoffrey Howe","Nigel Lawson","Michael Heseltine","Kenneth Baker"],
"Tony Blair":["Gordon Brown","Jack Straw","John Prescott","David Blunkett"],
"David Cameron":["George Osborne","Theresa May","William Hague","Michael Gove"],
"Theresa May":["Philip Hammond","Amber Rudd","David Davis","Boris Johnson"],
"Boris Johnson":["Rishi Sunak","Dominic Raab","Michael Gove","Priti Patel"],
"Rishi Sunak":["Jeremy Hunt","James Cleverly","Suella Braverman","Oliver Dowden"],
"Sir Keir Starmer":["Rachel Reeves","David Lammy","Yvette Cooper","John Healey"]
};

const DEFAULT={
theme:"light",role:null,name:"",party:"Labour",side:"Government",leader:"",
day:1,month:1,year:2026,approval:50,trust:50,influence:20,local:50,media:50,treasury:50,
majority:0,cabinet:[],cabinetMode:"custom",events:[],history:[],reports:[],voterLikes:[],
election:{weeks:0,active:false,snap:false},lostLeadership:false
};

let state=load();
applyTheme();

function load(){
 try{
   const x=JSON.parse(localStorage.getItem("the_commons_save"));
   return x?Object.assign({},DEFAULT,x):structuredClone(DEFAULT);
 }catch(e){return structuredClone(DEFAULT)}
}
function save(){localStorage.setItem("the_commons_save",JSON.stringify(state))}
function reset(){localStorage.removeItem("the_commons_save");state=structuredClone(DEFAULT);applyTheme();home()}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function clamp(x){return Math.max(0,Math.min(100,Math.round(x)))}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.style.display="block";setTimeout(()=>el.style.display="none",2200)}
function applyTheme(){document.body.classList.toggle("dark",state.theme==="dark")}
function stat(a,b){return `<div class="stat"><span class="muted">${a}</span><b>${b}</b></div>`}
function card(title,body){return `<article class="card"><h2>${title}</h2>${body}</article>`}
function careerCard(role,title,desc){return `<article class="card career"><h3>${title}</h3><p class="muted">${desc}</p><button class="primary" onclick="newCareer('${role}')">Start / New Game</button></article>`}

function home(){
document.getElementById("app").innerHTML=`
<section class="hero">
 <div class="hero-main">
  <div class="eyebrow">Westminster political career simulator</div>
  <h1>Build a career.<br>Face the country.</h1>
  <p>Run a government, sit on the opposition benches, campaign for votes, report the political day, or enter the House of Lords. Your choices change approval, trust, influence and what happens next.</p>
  <div class="row">
   <button class="primary" onclick="careers()">Start a career</button>
   <button class="secondary" onclick="daily()">Today's political report</button>
  </div>
 </div>
 <aside class="hero-side">
  <div class="eyebrow">Current save</div>
  <h2>${state.role?esc(ROLES[state.role]):"No career started"}</h2>
  <p>${state.name?esc(state.name)+" · "+esc(state.party):"Start any career. You can restart it at any time."}</p>
  <div class="stats">${stat("Approval",state.approval+"%")}${stat("Trust",state.trust+"%")}${stat("Influence",state.influence)}${stat("Day",state.day)}</div>
  <div class="notice" style="margin-top:14px">Every in-game month generates unpredictable political incidents. They are gameplay events, not software bugs.</div>
 </aside>
</section>
<section class="section grid">
 ${careerCard("pm","Prime Minister","Lead the government, face Parliament, appoint a Cabinet, deal with the Monarch and fight elections.")}
 ${careerCard("mp","MP Career","Choose Government or Opposition, ask PMQs, work in Parliament and visit your constituency.")}
 ${careerCard("chancellor","Chancellor","Control the Treasury, make fiscal choices and manage political and economic pressure.")}
 ${careerCard("electioneer","Electioneer","Run campaign operations, react to polling and fight general or snap elections.")}
 ${careerCard("voter","Voter Career","Choose a party, receive policies, like or dislike them and switch parties when your views change.")}
 ${careerCard("reporter","News Report Career","Cover the day's political story and see how readers react to your reporting.")}
 ${careerCard("lord","House of Lords Career","Scrutinise legislation, table amendments, work in committees and negotiate cross-party.")}
</section>`;
}

function careers(){
document.getElementById("app").innerHTML=`
<div class="eyebrow">Career room</div><h1>Choose your career</h1>
<p class="muted">Every card starts a fresh game. Your current career can also be restarted from its dashboard.</p>
<section class="grid">
 ${careerCard("pm","Prime Minister","Win the general election four weeks before polling day, lead government and handle the Monarch.")}
 ${careerCard("mp","Member of Parliament","Government or Opposition, PMQs, constituency visits and surprise local events.")}
 ${careerCard("chancellor","Chancellor","Budgets, public spending, revenue, growth and political consequences.")}
 ${careerCard("electioneer","Electioneer","Campaign HQ, polling, message discipline and election results.")}
 ${careerCard("voter","Voter","Party choice, policy reactions and switching between parties.")}
 ${careerCard("reporter","News Reporter","Daily newsroom, reports, trust and readership.")}
 ${careerCard("lord","House of Lords","Peer career with scrutiny, amendments, committees and negotiations.")}
</section>`;
}

function newCareer(role){
 state=structuredClone(DEFAULT);
 state.role=role;
 state.name="Alex Morgan";
 state.party="Labour";
 state.side=role==="mp"?"Government":"Government";
 if(role==="pm"){
  open(`
   <h2>Start Prime Minister Career</h2>
   <p class="muted">Choose whether you are your own PM or play a historical premiership.</p>
   <div class="field"><label>Your name</label><input id="name" value="Alex Morgan"></div>
   <div class="field"><label>Party</label><select id="party">${PARTIES.map(p=>`<option>${p}</option>`).join("")}</select></div>
   <div class="field"><label>PM scenario</label><select id="leader"><option value="own">My own Prime Minister</option>${PM_LIST.map(p=>`<option>${p}</option>`).join("")}</select></div>
   <div class="field"><label>Cabinet</label><select id="cab"><option value="custom">I will build my own</option><option value="historical">Use the historical Cabinet for this PM</option></select></div>
   <button class="primary" onclick="beginPM()">Begin premiership</button>
   <button class="secondary" onclick="closeModal()">Cancel</button>
  `);
 }else if(role==="mp"){
  open(`
   <h2>Start MP Career</h2>
   <div class="field"><label>Your name</label><input id="name" value="Alex Morgan"></div>
   <div class="field"><label>Party</label><select id="party">${PARTIES.map(p=>`<option>${p}</option>`).join("")}</select></div>
   <div class="field"><label>Choose your benches</label><select id="side"><option>Government</option><option>Opposition</option></select></div>
   <button class="primary" onclick="beginSimple('mp')">Enter the Commons</button>
  `);
 }else{
  open(`
   <h2>Start ${ROLES[role]} Career</h2>
   <div class="field"><label>Your name</label><input id="name" value="Alex Morgan"></div>
   <div class="field"><label>Party</label><select id="party">${PARTIES.map(p=>`<option>${p}</option>`).join("")}</select></div>
   <button class="primary" onclick="beginSimple('${role}')">Begin career</button>
  `);
 }
}
function beginPM(){
 state.name=document.getElementById("name").value.trim()||"Alex Morgan";
 state.party=document.getElementById("party").value;
 const leader=document.getElementById("leader").value;
 state.leader=leader==="own"?state.name:leader;
 state.cabinetMode=document.getElementById("cab").value;
 if(state.cabinetMode==="historical") state.cabinet=HIST_CAB[state.leader]||HIST_CAB["Sir Keir Starmer"];
 state.history.push(`Premiership began: ${state.leader}`);
 closeModal(); addEvent("Premiership begins",`${state.leader} takes office. A general election must be won four weeks before polling day.`);save();dashboard();
}
function beginSimple(role){
 state.name=document.getElementById("name").value.trim()||"Alex Morgan";
 state.party=document.getElementById("party").value;
 if(role==="mp")state.side=document.getElementById("side").value;
 state.history.push(`Started ${ROLES[role]} career`);
 closeModal(); addEvent("Career begins",`You begin as ${ROLES[role]}.`);save();dashboard();
}

function dashboard(){
 if(!state.role){home();return}
 let content="";
 if(state.role==="pm")content=pm();
 if(state.role==="mp")content=mp();
 if(state.role==="chancellor")content=chancellor();
 if(state.role==="electioneer")content=electioneer();
 if(state.role==="voter")content=voter();
 if(state.role==="reporter")content=reporter();
 if(state.role==="lord")content=lord();
 document.getElementById("app").innerHTML=`
 <div class="row"><span class="pill">${ROLES[state.role]}</span><span class="pill">${esc(state.party)}</span><span class="pill">Day ${state.day} · Month ${state.month}</span><button class="secondary" onclick="restartCareer()">Restart this career</button><button class="secondary" onclick="sharePage()">Share</button></div>
 <h1>${esc(state.name)}</h1>
 <div class="stats">${stat("Approval",state.approval+"%")}${stat("Trust",state.trust+"%")}${stat("Influence",state.influence)}${stat("Local",state.local+"%")}</div>
 <section class="section">${content}</section>`;
}

function pm(){
 const preSocial=PM_LIST.indexOf(state.leader)>=0 && PM_LIST.indexOf(state.leader)<PM_LIST.indexOf("Tony Blair");
 return `
 <div class="split">
 ${card("Premiership",`<p><b>${esc(state.leader||state.name)}</b> · ${esc(state.party)}</p>
 <p class="muted">You need to win the general election with the four-week campaign window. A snap election can happen at any point.</p>
 <div class="row"><button class="primary" onclick="pmCrisis()">Today's PM decision</button><button class="secondary" onclick="monarch()">Monarch audience</button><button class="secondary" onclick="startElection(true)">Prepare election</button></div>`)}
 ${card("Cabinet",`<p>${state.cabinet.length?state.cabinet.map(x=>`<span class="pill">${esc(x)}</span>`).join(" "):"No Cabinet appointed."}</p>
 <div class="row"><button class="primary" onclick="cabinetBuilder()">Build my Cabinet</button><button class="secondary" onclick="historicalCabinet()">Historical Cabinet</button></div>`)}
 </div>
 <section class="section">${card("Public feedback",`<p>${preSocial?"Because this premiership is set before social media, feedback arrives through newspapers, letters and political correspondence.":"Modern feedback includes newspapers, broadcast coverage and social-media-style public reaction."}</p><button class="primary" onclick="feedback()">Read feedback</button>`)}</section>
 <section class="section">${card("Leadership",`<p>Lose a leadership election? You can continue the career under the new leader and play as them.</p><button class="secondary" onclick="leadership()">Run leadership election</button> <button class="secondary" onclick="snap()">Call snap election</button>`)}</section>
 ${diary()}`;
}
function mp(){
 return `<div class="split">
 ${card("Your Commons role",`<h3>${esc(state.side)}</h3><p>Ask the Prime Minister questions, make speeches and decide how loyal you want to be.</p><button class="primary" onclick="pmqs()">Go to PMQs</button>`)}
 ${card("Constituency",`<p>Local reputation: <b>${state.local}%</b></p><button class="primary" onclick="constituency()">Visit constituency</button><p class="muted">A surprise is randomly selected during every visit.</p>`)}
 </div>
 <section class="section">${card("Parliamentary choices",`<div class="list">
 <button class="choice" onclick="effect(3,1,5,0,2,'Commons speech')"><strong>Make a Commons speech</strong><span>Put your argument on the record.</span></button>
 <button class="choice" onclick="effect(1,5,5,1,0,'Committee work')"><strong>Join a committee</strong><span>Build influence through detailed scrutiny.</span></button>
 <button class="choice" onclick="effect(-2,4,7,0,3,'Rebel against the whip')"><strong>Test the whip</strong><span>Take a difficult position against your party.</span></button>
 </div>`)}</section>${diary()}`;
}
function chancellor(){
 return `<div class="split">
 ${card("Treasury",`<p>Fiscal confidence: <b>${state.treasury}</b></p><div class="list">
 <button class="choice" onclick="budget('spend')"><strong>Increase public investment</strong><span>Services improve, but fiscal headroom falls.</span></button>
 <button class="choice" onclick="budget('tax')"><strong>Raise revenue</strong><span>The books improve, but voters may object.</span></button>
 <button class="choice" onclick="budget('growth')"><strong>Launch a growth package</strong><span>Bet on investment and business confidence.</span></button>
 </div>`)}
 ${card("Treasury briefing",`<p>Approval ${state.approval}% · Trust ${state.trust}%</p><button class="primary" onclick="treasuryBrief()">Face today's briefing</button>`)}
 </div>${diary()}`;
}
function electioneer(){
 return `<div class="split">
 ${card("Campaign HQ",`<p>Estimated campaign score: <b>${Math.round(state.approval+state.trust/2+state.influence)}</b></p><div class="list">
 <button class="choice" onclick="campaign('ground')"><strong>Ground campaign</strong><span>Visit marginal seats and strengthen local organisation.</span></button>
 <button class="choice" onclick="campaign('media')"><strong>Media campaign</strong><span>Own the national message.</span></button>
 <button class="choice" onclick="campaign('policy')"><strong>Major policy launch</strong><span>Take a bold policy to the country.</span></button>
 </div>`)}
 ${card("Election calendar",`<p>${state.election.active?`Campaign week ${state.election.weeks} of 4`:"No election currently underway."}</p><button class="primary" onclick="startElection(false)">Start general election</button><button class="secondary" onclick="runElection()">Count the votes</button>`)}
 </div>${diary()}`;
}
function voter(){
 const liked=state.voterLikes.length;
 return `<div class="split">
 ${card("Your politics",`<p>Current party: <b>${esc(state.party)}</b></p><p>Policies liked: ${liked}</p><button class="primary" onclick="policy()">Hear a new party policy</button>`)}
 ${card("Switch party",`<p class="muted">Switch whenever you want. The next party's policies may fit your preferences better or worse.</p><div class="list">${PARTIES.map(p=>`<button class="choice" onclick="switchParty('${p}')"><strong>${p}</strong><span>Choose ${p} and see what they offer next.</span></button>`).join("")}</div>`)}
 </div>${diary()}`;
}
function reporter(){
 return `<div class="split">
 ${card("News desk",`<p>Reader trust: <b>${state.media}%</b></p><button class="primary" onclick="writeReport()">Write today's report</button><button class="secondary" onclick="realReport()">Open today's report briefing</button>`)}
 ${card("Archive",`${state.reports.length?`<div class="log">${state.reports.slice().reverse().map(x=>`<div>${esc(x)}</div>`).join("")}</div>`:"<p class='muted'>No reports filed yet.</p>"}`)}
 </div>${diary()}`;
}
function lord(){
 return `<div class="split">
 ${card("Lords chamber",`<p>Influence: <b>${state.influence}</b></p><div class="list">
 <button class="choice" onclick="lordAction('scrutiny')"><strong>Scrutinise a Bill</strong><span>Question the government's case.</span></button>
 <button class="choice" onclick="lordAction('amend')"><strong>Table an amendment</strong><span>Try to change the legislation.</span></button>
 <button class="choice" onclick="lordAction('committee')"><strong>Launch a committee inquiry</strong><span>Build evidence and cross-party support.</span></button>
 </div>`)}
 ${card("Cross-party diplomacy",`<p>Trust: ${state.trust}%</p><button class="primary" onclick="negotiate()">Negotiate a compromise</button>`)}
 </div>${diary()}`;
}
function diary(){
 return `<section class="section">${card("Political diary",`<div class="log">${state.events.slice().reverse().map(e=>`<div><b>${esc(e.title)}</b><br><span class="muted">${esc(e.text)}</span></div>`).join("")||"<div>No events yet.</div>"}</div>`)}</section>`;
}

function addEvent(title,text){state.events.push({title,text});if(state.events.length>40)state.events.shift();state.history.push(`${title}: ${text}`);save()}
function advance(days=1){
 for(let i=0;i<days;i++){
  state.day++;
  if(state.day>28){
   state.day=1;state.month++;
   addEvent("Monthly political incident",monthlyIncident());
   addEvent("Second monthly incident",monthlyIncident());
  }
 }
 save();
}
function monthlyIncident(){
 const x=[
 ["Hospital pressure","A hospital asks for urgent help and the story reaches the national press."],
 ["By-election shock","A previously safe seat suddenly looks competitive."],
 ["Cabinet disagreement","Two senior figures disagree publicly over the government's direction."],
 ["Community breakthrough","A local project succeeds far beyond expectations."],
 ["Economic warning","Forecasters issue a cautious warning and markets react nervously."],
 ["Front-page splash","A major newspaper turns a routine policy into a national political story."],
 ["Unexpected endorsement","A respected community figure publicly backs your approach."],
 ["Transport disruption","A major transport problem creates pressure on ministers and MPs."]
 ];
 return x[Math.floor(Math.random()*x.length)][1];
}
function effect(a,t,i,l,m,title){
 state.approval=clamp(state.approval+a);state.trust=clamp(state.trust+t);state.influence=Math.max(0,state.influence+i);
 state.local=clamp(state.local+l);state.media=clamp(state.media+m);
 addEvent(title||"Decision",`Approval ${a>=0?"+":""}${a}, trust ${t>=0?"+":""}${t}, influence ${i>=0?"+":""}${i}.`);
 advance();
 dashboard();
}
function open(html){document.getElementById("modalbox").innerHTML=html;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function choose(title,text,items){
 open(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="list">${items.map((x,i)=>`<button class="choice" onclick="closeModal();choiceFns[${i}]()"><strong>${esc(x[0])}</strong><span>${esc(x[1]||"")}</span></button>`).join("")}</div>`);
 window.choiceFns=items.map(x=>x[2]);
}
function pmCrisis(){
 choose("Today's PM decision","A fast-moving political story needs an answer.",[
 ["Announce a firm plan","Strong and immediate.",()=>effect(5,3,4,0,2,"PM crisis: firm plan")],
 ["Consult the Cabinet","Slower, but builds internal trust.",()=>effect(2,7,2,1,1,"PM crisis: Cabinet consultation")],
 ["Ask for more time","Avoids an immediate mistake, but looks hesitant.",()=>effect(-2,1,0,0,-1,"PM crisis: delay")]
 ]);
}
function monarch(){
 choose("Audience with the Monarch","You give a formal update on government business.",[
 ["Present the government's plan","Confident and clear.",()=>effect(3,3,3,0,1,"Monarch audience")],
 ["Ask for private counsel","Seek constitutional perspective.",()=>effect(1,6,2,0,0,"Monarch audience")],
 ["Admit uncertainty","Honest, but politically risky.",()=>effect(-1,7,0,0,0,"Monarch audience")]
 ]);
}
function feedback(){
 const modern=PM_LIST.indexOf(state.leader)>=PM_LIST.indexOf("Tony Blair");
 const choices=modern?[
 ["Read public reaction","Social, broadcast and newspaper reaction.",()=>effect(2,1,1,0,3,"Modern feedback")],
 ["Read supportive letters","Positive correspondence from voters.",()=>effect(3,3,1,2,1,"Modern feedback")],
 ["Read the hostile coverage","A difficult press cycle.",()=>effect(-3,-2,0,0,-2,"Modern feedback")]
 ]:[
 ["Read the newspapers","Front pages and editorials.",()=>effect(2,1,1,0,2,"Newspaper feedback")],
 ["Open the letters","Correspondence from constituents and political figures.",()=>effect(3,4,1,3,0,"Letter feedback")],
 ["Read the political correspondence","Private reactions from Westminster.",()=>effect(0,5,3,0,0,"Political correspondence")]
 ];
 choose(modern?"Modern public feedback":"Historical public feedback",modern?"Newspapers, broadcasts and modern public reaction are arriving.":"Because this PM predates social media, feedback arrives through newspapers, letters and correspondence.",choices);
}
function pmqs(){
 choose("Prime Minister's Questions","The Speaker calls the chamber to order. Your question can shape the next news cycle.",[
 ["Press the Prime Minister on policy","Put the government's position under pressure.",()=>effect(3,1,4,1,2,"PMQs")],
 ["Ask a constituency question","Make the issue local and practical.",()=>effect(2,2,2,5,0,"PMQs")],
 ["Make a point of order","Use parliamentary procedure.",()=>effect(-1,0,1,0,0,"PMQs")]
 ]);
}
function constituency(){
 const a=[
 ["Hospital crisis","The local hospital needs urgent support.",4,7],
 ["School success","A local school wins a national award.",5,6],
 ["Factory closure","Workers ask what you will do about threatened jobs.",-4,-7],
 ["Community surprise","A grassroots group presents a successful project.",6,5],
 ["Flooding","Residents need immediate practical help.",3,8]
 ];
 const x=a[Math.floor(Math.random()*a.length)];
 choose("Constituency surprise",x[0],[
 ["Stay and act",x[1],()=>effect(x[2],2,2,x[3],1,"Constituency visit")],
 ["Listen and report back","Promise to take the issue to Parliament.",()=>effect(1,4,2,Math.max(1,x[3]-1),0,"Constituency visit")],
 ["Leave for Westminster","You prioritise parliamentary business.",()=>effect(-2,-1,0,0,0,"Constituency visit")]
 ]);
}
function budget(x){
 if(x==="spend"){state.treasury=Math.max(0,state.treasury-10);effect(6,1,4,2,1,"Budget: public investment")}
 if(x==="tax"){state.treasury+=10;effect(-4,5,3,0,1,"Budget: revenue")}
 if(x==="growth"){state.treasury=Math.max(0,state.treasury-3);effect(5,2,5,0,4,"Budget: growth")}
}
function treasuryBrief(){
 choose("Treasury briefing","The latest forecast changes the political room for manoeuvre.",[
 ["Act cautiously","Protect fiscal credibility.",()=>effect(2,6,2,0,0,"Treasury briefing")],
 ["Take a growth gamble","Risk more for potential growth.",()=>effect(5,-2,6,0,3,"Treasury briefing")],
 ["Delay","Wait for more information.",()=>effect(-3,-3,-1,0,-2,"Treasury briefing")]
 ]);
}
function campaign(x){
 if(x==="ground")effect(4,3,5,6,0,"Campaign: ground operation");
 if(x==="media")effect(3,0,3,0,7,"Campaign: media");
 if(x==="policy")effect(6,-2,6,0,5,"Campaign: policy launch");
}
function startElection(fromPM){
 state.election={active:true,weeks:1,snap:false};
 addEvent("Election campaign begins",fromPM?"The four-week general election campaign is underway.":"Campaign HQ opens and the first week begins.");
 save();dashboard();
}
function runElection(){
 if(!state.election.active){toast("Start an election campaign first.");return}
 const score=state.approval+state.trust+state.influence+Math.floor(Math.random()*26)+(state.election.weeks>=4?10:0);
 const win=score>=125;
 state.election.active=false;
 if(win){
   state.majority=Math.max(1,Math.floor((score-100)/4));
   state.approval=clamp(state.approval+5);state.trust=clamp(state.trust+4);
   addEvent("Election result","You won enough support to form a government.");
 }else{
   state.majority=0;state.approval=clamp(state.approval-6);
   addEvent("Election result","You lost the election. The career can continue in opposition or through a leadership contest.");
 }
 advance(2);dashboard();
}
function snap(){
 choose("Snap election","Calling a snap election is risky. Polling can move quickly.",[
 ["Call it","Take the country to the polls.",()=>{state.election={active:true,weeks:1,snap:true};effect(-2,1,5,0,3,"Snap election called")}],
 ["Wait","Continue governing.",()=>effect(1,3,0,0,0,"Snap election avoided")]
 ]);
}
function leadership(){
 const winner=Math.random()<.48?state.name:(Math.random()<.5?"The New Leader":"The Unity Candidate");
 if(winner===state.name){
   addEvent("Leadership election","You retained the leadership.");
   effect(3,4,4,0,1,"Leadership election");
 }else{
   state.lostLeadership=true;
   state.leader=winner;state.name=winner;state.cabinet=[];
   state.approval=48;state.trust=45;state.influence+=3;
   addEvent("Leadership election",`${winner} won. You chose to continue the career by taking the new leader's role.`);
   save();dashboard();
 }
}
function cabinetBuilder(){
 open(`<h2>Build your Cabinet</h2><p class="muted">Create your own Cabinet. Historical Cabinet presets are also available.</p>
 ${["Treasury","Foreign Affairs","Home Affairs","Health","Education","Transport"].map((x,i)=>`<div class="field"><label>${x}</label><input id="cab${i}" placeholder="Minister name"></div>`).join("")}
 <button class="primary" onclick="saveCabinet()">Appoint Cabinet</button> <button class="secondary" onclick="closeModal()">Cancel</button>`);
}
function saveCabinet(){
 state.cabinet=[0,1,2,3,4,5].map(i=>document.getElementById("cab"+i).value.trim()).filter(Boolean);
 state.cabinetMode="custom";addEvent("Cabinet appointed",`${state.cabinet.length} ministers appointed.`);save();closeModal();dashboard();
}
function historicalCabinet(){
 const c=HIST_CAB[state.leader]||HIST_CAB["Sir Keir Starmer"];
 state.cabinet=c;state.cabinetMode="historical";
 addEvent("Historical Cabinet selected",`A ${state.leader} era Cabinet has been loaded.`);save();dashboard();
}
function policy(){
 const policies=["Increase NHS investment","Cut taxes for working households","Build more homes","Tighten migration rules","Invest heavily in green energy","Give councils more powers","Expand apprenticeships"];
 const p=policies[Math.floor(Math.random()*policies.length)];
 choose("New party policy",`${state.party} proposes: ${p}.`,[
 ["Like it","Add it to your preferred policies.",()=>{state.voterLikes.push(p);effect(5,3,2,0,1,"Policy liked")}],
 ["Dislike it","This policy pushes you away.",()=>effect(-5,-1,-1,0,1,"Policy disliked")],
 ["Unsure","Wait for more detail.",()=>effect(0,1,0,0,0,"Policy undecided")]
 ]);
}
function switchParty(p){
 const old=state.party;state.party=p;addEvent("Party switch",`You switched from ${old} to ${p}.`);effect(0,-2,2,0,0,"Party switch");
}
function writeReport(){
 const angles=["government pressure","a constituency dispute","an economic warning","a surprise Commons result","a Cabinet disagreement"];
 const a=angles[Math.floor(Math.random()*angles.length)];
 const r=`Day ${state.day}: I reported on ${a}, separating verified facts from political claims.`;
 state.reports.push(r);state.media=clamp(state.media+4);addEvent("Report filed",r);advance();dashboard();
}
function realReport(){
 choose("Today's report briefing","A fictionalised daily newsroom briefing: ministers are under pressure, opposition MPs are testing the government's position and voters are watching whether politicians follow through.",[
 ["Report cautiously","Separate facts from claims.",()=>effect(2,5,2,0,6,"News report")],
 ["Lead with the conflict","Make the political clash the headline.",()=>effect(4,-2,3,0,7,"News report")],
 ["Focus on voters","Put constituency voices first.",()=>effect(5,3,2,3,4,"News report")]
 ]);
}
function lordAction(x){
 if(x==="scrutiny")effect(2,5,5,0,1,"Lords scrutiny");
 if(x==="amend")effect(3,4,6,0,2,"Lords amendment");
 if(x==="committee")effect(1,7,5,1,0,"Lords committee");
}
function negotiate(){
 choose("Cross-party negotiation","A Bill is close to passing, but several peers want changes.",[
 ["Accept a compromise","Bring more peers with you.",()=>effect(3,8,5,0,0,"Lords negotiation")],
 ["Hold your ground","Protect your original position.",()=>effect(1,-2,7,0,1,"Lords negotiation")],
 ["Broker a wider deal","Spend influence to build a broader agreement.",()=>effect(5,5,8,0,3,"Lords negotiation")]
 ]);
}
function restartCareer(){
 if(confirm("Start a completely new game for this career?"))newCareer(state.role);
}
function daily(){
 document.getElementById("app").innerHTML=`
 <div class="eyebrow">Daily political report</div><h1>What would you do today?</h1>
 <div class="split">
 ${card("Westminster briefing",`<div class="notice"><b>Today's scenario</b><br>Parliament is preparing for another difficult sitting. Ministers, opposition MPs, journalists and voters are watching the next move.</div>
 <div class="row" style="margin-top:14px"><button class="primary" onclick="dailyChoice('decisive')">Act decisively</button><button class="secondary" onclick="dailyChoice('consult')">Consult first</button><button class="secondary" onclick="dailyChoice('wait')">Wait</button></div>`)}
 ${card("Your diary",`<div class="log">${state.history.slice(-12).reverse().map(x=>`<div>${esc(x)}</div>`).join("")||"<div>No career diary yet.</div>"}</div>`)}
 </div>`;
}
function dailyChoice(x){
 const d={decisive:[5,0,4],consult:[2,5,2],wait:[-2,2,-1]}[x];
 effect(d[0],d[1],d[2],0,1,"Daily decision");
}
function sharePage(){
 const text=state.role?`My career in The Commons: ${state.name} — ${ROLES[state.role]} — ${state.party}. Approval ${state.approval}%, Trust ${state.trust}%, Influence ${state.influence}.`:"Start a career to create your share card.";
 document.getElementById("app").innerHTML=`
 <div class="eyebrow">Career share</div><h1>Share your political story</h1>
 ${card("Your career card",`<h2>${esc(state.name||"The Commons")}</h2><p>${esc(text)}</p><div class="stats">${stat("Approval",state.approval+"%")}${stat("Trust",state.trust+"%")}${stat("Influence",state.influence)}${stat("Day",state.day)}</div><div class="row" style="margin-top:15px"><button class="primary" onclick="share()">Share</button><button class="secondary" onclick="copyShare()">Copy text</button></div>`)}
 `;
}
function share(){
 const text=`My career in The Commons: ${state.name} — ${ROLES[state.role]} — ${state.party}. Approval ${state.approval}%, Trust ${state.trust}%, Influence ${state.influence}.`;
 if(navigator.share)navigator.share({title:"The Commons career",text}).catch(()=>{});
 else copyShare();
}
function copyShare(){
 const text=`My career in The Commons: ${state.name} — ${ROLES[state.role]} — ${state.party}. Approval ${state.approval}%, Trust ${state.trust}%, Influence ${state.influence}.`;
 if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast("Career summary copied."));
 else toast(text);
}
function settings(){
 document.getElementById("app").innerHTML=`
 <div class="eyebrow">Settings</div><h1>Game settings</h1>
 <section class="grid">
 ${card("Appearance",`<p>Light or dark mode.</p><button class="primary" onclick="setTheme('light')">Light</button> <button class="secondary" onclick="setTheme('dark')">Dark</button>`)}
 ${card("Save",`<p>Your current career is automatically saved in this browser.</p><button class="secondary" onclick="exportSave()">Export save</button> <button class="secondary" onclick="importSave()">Import save</button>`)}
 ${card("Discord",`<p class="muted">Discord login requires a configured OAuth application. The standalone GitHub version is playable without an account.</p><button class="secondary" onclick="toast('The game works without login. Discord OAuth can be added after configuring your Supabase Auth provider.')">Discord setup</button>`)}
 </section>
 <section class="section">${card("Supabase",`<p class="muted">This GitHub-ready version deliberately has no build step and no server dependency, so it works immediately on GitHub Pages. You can connect the save layer later without preventing the game from loading.</p><button class="danger" onclick="reset()">Delete local save</button>`)}</section>`;
}
function setTheme(t){state.theme=t;save();applyTheme();settings()}
function exportSave(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="the-commons-save.json";a.click();URL.revokeObjectURL(a.href);
}
function importSave(){
 const i=document.createElement("input");i.type="file";i.accept=".json";
 i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{state=Object.assign({},DEFAULT,JSON.parse(r.result));save();applyTheme();dashboard();toast("Save imported.")}catch(e){toast("That save file is invalid.")}};r.readAsText(i.files[0])};i.click();
}
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
if(state.role)dashboard();else home();
</script>
</body>
</html>
